<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>신고 처리 · Escaplix 목업</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-as="admin">
  <main class="layout">
    <section>
      <div class="screen-id">S16 · admin-reports.html · C · 이번 범위 제외</div>
      <h1>후기 신고</h1>
      <div class="scope-out">회의 v2: 이번 구현 범위에서 빠진 화면이에요 (나중 기능). 신고 접수는 테마 상세의 후기 자리에서 받아 두기만 해요. 아래는 나중에 만들 때 참고용.</div>
      <div class="row small" style="margin-bottom:12px"><a class="btn small">WAIT 대기</a><a class="btn gray small">DONE 처리됨</a></div>
      <div class="card">
        <div class="spread"><b>신고 사유: 사실과 다른 내용이 있어요.</b><span class="badge warn">WAIT</span></div>
        <div class="small muted">신고자 회원번호 2 · 11/16</div>
        <div class="card" style="margin-top:10px;background:var(--surface2)">
          <div class="small"><b>방린이</b>의 후기 · 좀비 연구소 · ★☆☆☆☆</div>
          <div>돈 아까워요. 직원도 불친절했어요.</div>
        </div>
        <div class="row" style="margin-top:12px">
          <button class="btn danger">후기 숨김 (HIDDEN)</button>
          <button class="btn gray">그대로 두기</button>
        </div>
      </div>
    </section>

  </main>
  <script src="js/common.js"></script>
</body>
</html>
