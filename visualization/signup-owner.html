<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사장 회원가입 · Escaplix 목업</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-as="guest">
  <main class="layout">
    <section class="narrow" style="--w:460px">
      <div class="screen-id">S03-2 · signup-owner.html · A</div>
      <div class="small"><a href="signup.html">← 가입 유형 다시 고르기</a></div>
      <h1>🏪 사장 회원가입</h1>
      <div class="card">
        <label for="id">아이디</label>
        <div class="row inline">
          <input id="id" value="owner9" style="flex:1">
          <button class="btn gray small" type="button">중복 확인</button>
        </div>
        <p class="badge ok" style="margin-top:6px">사용할 수 있는 아이디예요</p>

        <label for="pw">비밀번호</label>
        <input id="pw" type="password" value="1234">

        <label for="pw2">비밀번호 확인</label>
        <input id="pw2" type="password" value="1234">
        <p id="pw-msg" class="badge ok" style="margin-top:6px">비밀번호가 같아요</p>

        <label for="nick">닉네임 (손님에게 보이는 이름)</label>
        <input id="nick" value="미스터리룸합정">

        <label for="biz">사업자등록번호</label>
        <div class="row inline">
          <input id="biz" value="111-22-33333" style="flex:1">
          <button class="btn gray small" type="button">중복 확인</button>
        </div>
        <p class="badge ok" style="margin-top:6px">등록되지 않은 번호예요</p>

        <label>사업자등록증 (이미지)</label>
        <input type="file" accept="image/*">
        <div class="img-ph" style="height:110px;margin-top:8px">사업자등록증.jpg 미리보기 자리<br>관리자가 사장 본인 확인에 써요</div>

        <div class="card small" style="margin-top:14px;background:var(--accent-soft);border-color:var(--line)">
          <b>가입 후에 할 일</b>
          <ol style="margin:6px 0 0;padding-left:18px">
            <li>사장 홈 → <b>매장 등록</b> (매장마다 사업장 등록번호, 사업장등록증 사진)</li>
            <li>관리자가 매장을 승인하면</li>
            <li>테마와 시간표를 등록할 수 있어요</li>
          </ol>
        </div>

        <div style="margin-top:16px"><a class="btn" href="login.html" style="width:100%;text-align:center">가입하기</a></div>
      </div>
    </section>
  </main>
  <script src="js/common.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
