<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 채팅 · Escaplix 목업</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-as="user">
  <main class="layout">
    <section>
      <div class="screen-id">S20 (신규) · chats.html (마이페이지 내 채팅 탭) · A</div>
      <h1>탈출왕 님의 마이페이지</h1>
      <div class="tabs">
        <a href="mypage.html">내 기록</a>
        <a href="wishes.html">찜 목록 (3)</a>
        <a class="on" href="chats.html">내 채팅 (3)</a>
        <a href="profile.html">내 정보</a>
      </div>
      <div class="grid" style="grid-template-columns:1fr">
        <a class="card" href="party-room.html?view=leader" style="text-decoration:none;color:inherit">
          <div class="spread">
            <b>인형의 집 같이 가실 분 (추리 좋아하는 분)</b>
            <span><span class="tag">👑 방장</span> <span class="badge ok">RECRUITING</span></span>
          </div>
          <div class="spread small">
            <span class="muted">탈출왕: 무서운 건 제가 앞장설게요 ㅋㅋ 두 명만 더…</span>
            <span class="muted">09:06 · 2명</span>
          </div>
        </a>
        <a class="card" href="party-room.html?view=member" style="text-decoration:none;color:inherit">
          <div class="spread">
            <b>금고털이 토요일 오전팟</b>
            <span class="badge warn">FULL</span>
          </div>
          <div class="spread small">
            <span class="muted">방린이: 예약 완료했어요! 10시 50분까지 와 주세요</span>
            <span class="muted">어제 · 4명</span>
          </div>
        </a>
        <div class="card" style="opacity:.7">
          <div class="spread">
            <b>사라진 기억 평일팟</b>
            <span class="badge">CLOSED</span>
          </div>
          <div class="spread small">
            <span class="muted">힌트없이: 다들 수고하셨어요~</span>
            <span class="muted">11/09 · 3명</span>
          </div>
          <div style="margin-top:8px"><a class="btn ghost small" href="#" data-review data-theme="사라진 기억 · 어둠상자 홍대점" data-limit="70" data-ppl="3">끝난 파티 · 후기 쓰기</a></div>
        </div>
      </div>
    </section>

  </main>
  <script src="js/common.js"></script>
  <script src="js/review-modal.js"></script>
</body>
</html>
